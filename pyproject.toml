[project]
name = "major-project"
version = "0.1.0"
description = "Neuro-symbolic fast-slow LLM agent for partially observable environments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.2",
    "langchain-openai>=1.0.0",
    "langchain-neo4j>=0.10.0",
    "neo4j>=6.3.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nesyfs"]
