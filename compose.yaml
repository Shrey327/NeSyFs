# Local development database only. Existing Neo4j users can skip this service.
services:
  neo4j:
    image: neo4j:5.26.26-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env before starting Neo4j}"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
