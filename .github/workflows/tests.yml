name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.4"
      - name: Install Python and locked dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Run scripted environment example
        run: uv run --locked python examples/kitchen_walkthrough.py
      - name: Check Python syntax
        run: uv run --locked python -m compileall -q src main.py examples tests
      - name: Check patch whitespace
        run: git diff --check
